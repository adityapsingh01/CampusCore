<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>College ERP - Login</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .logo-text {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }
        .form-label {
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="login-container">
        <div class="logo-text">
            <h2>College ERP System</h2>
            <p>Multi-departmental College Management</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">
            Invalid username or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="alert alert-info">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Login</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <small>
                &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> College ERP. All rights reserved.
            </small>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>HOD Dashboard - College ERP</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 8px 8px 0 0;
        }
        .content {
            padding: 20px;
            background-color: white;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .info-card {
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 4px 4px 0;
        }
        .info-label {
            font-weight: 600;
            color: #2c3e50;
        }
        .info-value {
            font-size: 1.1em;
        }
        .btn-logout {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">College ERP</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="header">
        <h1>HOD Dashboard</h1>
        <p>Welcome, <span th:text="${fullName}">Faculty Name</span>!</p>
    </div>

    <div class="content">
        <div class="info-card">
            <div class="info-label">Username:</div>
            <div class="info-value" th:text="${username}">username</div>
        </div>
        <div class="info-card">
            <div class="info-label">Department:</div>
            <div class="info-value" th:text="${departmentName}">Department Name</div>
        </div>
        <div class="info-card">
            <div class="info-label">Department Code:</div>
            <div class="info-value" th:text="${departmentCode}">DEPT</div>
        </div>

        <div class="text-center">
            <a th:href="@{/hod/}" class="btn btn-outline-primary btn-logout">Go to HOD Portal</a>
            <a th:href="@{/logout}" class="btn btn-outline-danger btn-logout ms-2">Logout</a>
        </div>
    </div>
</div>
</body>
</html>
